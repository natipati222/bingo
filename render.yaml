services:
  - type: web
    name: live-bingo
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: BINGO_DATA_DIR
        value: /var/data
    disk:
      name: bingo-data
      mountPath: /var/data
      sizeGB: 1
